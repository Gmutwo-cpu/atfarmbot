<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATFarm - Fruits Farming AI Trading Forex</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: sans-serif; }
        .neon-border { border: 1px solid #00f076; box-shadow: 0 0 10px rgba(0, 240, 118, 0.2); }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Global Custom Popup Modal -->
    <div id="custom-popup" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 hidden">
        <div class="bg-[#0b0f19] p-6 rounded-xl w-80 neon-border relative">
            <button onclick="closePopup()" class="absolute top-3 right-3 text-gray-400 hover:text-white font-bold text-lg">×</button>
            <h3 class="text-[#00f076] font-bold text-lg mb-2">Notice</h3>
            <p id="popup-message" class="text-sm text-gray-300 mb-4">Dynamic message goes here.</p>
            <button onclick="closePopup()" class="w-full bg-[#00f076] text-black font-semibold py-2 rounded-lg hover:opacity-90">OK</button>
        </div>
    </div>

    <!-- Header Profil User -->
    <header class="p-4 border-b border-gray-800 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <img id="user-avatar" src="https://via.placeholder.com/40" alt="Avatar" class="w-10 h-10 rounded-full border border-[#00f076] object-cover">
            <div>
                <h4 id="user-name" class="font-bold text-sm text-white">Loading...</h4>
                <span id="user-id" class="text-xs text-gray-400">ID: --</span>
            </div>
        </div>
        <div class="flex space-x-3 text-xs">
            <div class="bg-gray-900 px-3 py-1 rounded-lg border border-gray-700">🪙 <span id="coin-balance">0</span></div>
            <div class="bg-gray-900 px-3 py-1 rounded-lg border border-gray-700">💎 <span id="atf-balance">0.0000</span></div>
        </div>
    </header>

    <!-- Main Content SPA -->
    <main class="flex-1 p-4 pb-20">
        <div id="app-view">
            <h2 class="text-xl font-bold text-[#00f076] mb-2">FARM Dashboard</h2>
            <p class="text-sm text-gray-400">Welcome to ATFarm sustainable agro ecosystem.</p>
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#0b0f19] border-t border-gray-800 flex justify-around py-3 text-xs">
        <button class="text-[#00f076] font-semibold">FARM</button>
        <button class="text-gray-400 hover:text-white">MARKET</button>
        <button class="text-gray-400 hover:text-white">TASK</button>
        <button class="text-gray-400 hover:text-white">FRIENDS</button>
        <button class="text-gray-400 hover:text-white">WALLET</button>
    </nav>

    <script>
        // Popup Handler
        function showPopup(message) {
            document.getElementById('popup-message').innerText = message;
            document.getElementById('custom-popup').classList.remove('hidden');
        }
        function closePopup() {
            document.getElementById('custom-popup').classList.add('hidden');
        }

        // Telegram WebApp Initialization & Fallback Logic
        async function initApp() {
            let userData = {
                id: 123456789, // Fallback local ID
                username: "local_farmer",
                first_name: "Local Farmer",
                photo_url: "https://via.placeholder.com/40"
            };

            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                const tgUser = window.Telegram.WebApp.initDataUnsafe.user;
                userData = {
                    id: tgUser.id,
                    username: tgUser.username || `user_${tgUser.id}`,
                    first_name: tgUser.first_name || "Farmer",
                    photo_url: tgUser.photo_url || "https://via.placeholder.com/40"
                };
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }

            // Render ke UI Header
            document.getElementById('user-avatar').src = userData.photo_url;
            document.getElementById('user-name').textContent = userData.first_name;
            document.getElementById('user-id').textContent = `ID: ${userData.id}`;

            // Kirim data ke Backend /api/user/init.js
            try {
                const response = await fetch('/api/user/init', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });
                const result = await response.json();
                if (result.success) {
                    document.getElementById('coin-balance').textContent = result.data.coins;
                    document.getElementById('atf-balance').textContent = result.data.atf_balance;
                } else {
                    showPopup("Failed to sync user data with server.");
                }
            } catch (error) {
                console.error("Initialization error:", error);
                showPopup("Network error during initialization.");
            }
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
