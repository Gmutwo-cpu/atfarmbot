<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATFarm - Fruits Farming AI Trading Forex</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>body { background-color: #0b0f19; color: #ffffff; font-family: sans-serif; }</style>
</head>
<body class="min-h-screen pb-20 flex flex-col justify-between">

    <!-- SPLASH SCREEN -->
    <div id="loading-screen" class="fixed inset-0 bg-[#0b0f19] flex flex-col items-center justify-center z-50 transition-opacity duration-500">
        <div class="text-5xl animate-bounce mb-4">🌱</div>
        <h2 class="text-[#00f076] font-bold text-xl mb-1">ATFarm</h2>
        <p class="text-xs text-gray-400 animate-pulse">Loading agricultural hub...</p>
    </div>

    <!-- HEADER PROFIL -->
    <header class="p-3 flex items-center justify-between bg-[#131b2e] border-b border-gray-800">
        <div class="flex items-center space-x-2">
            <img id="user-avatar" src="https://via.placeholder.com/36" alt="Avatar" class="w-9 h-9 rounded-full border border-[#00f076] object-cover">
            <div>
                <h2 id="user-name" class="font-bold text-xs text-white">Farmer</h2>
                <p id="user-id" class="text-[9px] text-gray-500">ID: --</p>
            </div>
        </div>
        <div class="text-right space-y-0.5">
            <div class="flex items-center justify-end space-x-1">
                <span class="text-[10px] text-gray-400">COINS: <span id="user-coins" class="text-[#00f076] font-bold">50</span></span>
            </div>
            <div class="flex items-center justify-end space-x-1">
                <span class="text-[10px] text-gray-400">ATF: <span id="user-atf" class="text-yellow-400 font-bold">0.0000</span></span>
            </div>
        </div>
    </header>

    <!-- KONTEN UTAMA DENGAN SISTEM SUB-TAB (ANTI-SCROLL) -->
    <main class="p-3 flex-1 overflow-y-auto max-h-[75vh]">
        
        <!-- 1. MENU FARM (Multi-Plot Compact) -->
        <div id="section-farm" class="space-y-3">
            <div class="flex justify-between items-center bg-[#131b2e] p-2.5 rounded-xl border border-gray-800 text-xs">
                <span>💧 Water: <b id="res-water">1</b></span>
                <span>🧪 Fert: <b id="res-fert">0</b></span>
                <span>🍎 Fruits: <b id="res-fruits">0</b></span>
                <button onclick="openModal('Claim Daily Bonus', 'claim_bonus')" class="bg-[#00f076] text-black px-2 py-1 rounded font-bold text-[10px]">Bonus</button>
            </div>

            <!-- Plots Grid Container -->
            <div id="plots-container" class="grid grid-cols-2 gap-2">
                <!-- Dinamik oleh JS -->
            </div>
        </div>

        <!-- 2. MENU MARKET -->
        <div id="section-market" class="space-y-3 hidden">
            <h2 class="text-sm font-bold text-[#00f076]">Agro Market & History</h2>
            <div class="grid grid-cols-2 gap-2 text-xs">
                <button onclick="buyItem('SEED')" class="bg-[#131b2e] border border-gray-800 p-2.5 rounded-xl text-left">
                    <p class="font-bold">Buy Seed</p><p class="text-[10px] text-gray-400">10 Coins</p>
                </button>
                <button onclick="transactMarket('SELL_FRUITS')" class="bg-[#131b2e] border border-gray-800 p-2.5 rounded-xl text-left">
                    <p class="font-bold text-red-400">Sell Fruits</p><p class="text-[10px] text-gray-400">45 Coins / pc</p>
                </button>
            </div>
            <!-- History Compact Box -->
            <div class="bg-[#131b2e] border border-gray-800 p-3 rounded-xl mt-2">
                <h3 class="font-bold text-xs text-[#00f076] mb-2">📜 Activity History</h3>
                <div id="history-list" class="space-y-1.5 text-[11px] text-gray-300 max-h-36 overflow-y-auto">
                    <p class="text-gray-500 italic">Loading history...</p>
                </div>
            </div>
        </div>

        <!-- 3. MENU TASK -->
        <div id="section-task" class="space-y-2 hidden">
            <h2 class="text-sm font-bold text-[#00f076]">Executive Missions</h2>
            <div class="bg-[#131b2e] border border-gray-800 p-2.5 rounded-xl flex justify-between items-center text-xs">
                <div><p class="font-bold">Watch Ads</p><p class="text-[10px] text-gray-400">Max 3x / day</p></div>
                <button onclick="completeTask('watch_ads')" class="bg-[#00f076] text-black px-3 py-1 rounded text-xs font-bold">Watch</button>
            </div>
        </div>

        <!-- 4. MENU FRIENDS -->
        <div id="section-friends" class="space-y-2 hidden">
            <h2 class="text-sm font-bold text-[#00f076]">Referral System</h2>
            <div class="bg-[#131b2e] border border-gray-800 p-3 rounded-xl text-center space-y-2">
                <input type="text" id="ref-link" readonly class="w-full bg-black/40 border border-gray-700 p-1.5 rounded text-[11px] text-center text-[#00f076]" value="...">
                <button onclick="copyRefLink()" class="w-full bg-[#00f076] text-black font-bold py-1.5 rounded text-xs">Copy Link</button>
            </div>
        </div>

        <!-- 5. MENU WALLET & WITHDRAW -->
        <div id="section-wallet" class="space-y-3 hidden">
            <h2 class="text-sm font-bold text-[#00f076]">Wallet & ATF Withdrawal</h2>
            <div class="bg-[#131b2e] border border-yellow-500/30 p-3 rounded-xl space-y-2 text-xs">
                <div class="flex justify-between"><span>Coins: <b class="text-[#00f076]" id="w-coins">50</b></span><span>ATF: <b class="text-yellow-400" id="w-atf">0</b></span></div>
                <input type="number" id="withdraw-amount-input" placeholder="Withdraw ATF (Max 500)" class="w-full bg-black/50 border border-gray-700 p-2 rounded text-xs text-white">
                <button onclick="requestAtfWithdrawal()" class="w-full bg-yellow-500 text-black font-bold py-1.5 rounded text-xs">Withdraw ATF (Req: 25k Coins)</button>
            </div>
            <!-- Deposit Packages Compact -->
            <div class="grid grid-cols-2 gap-2 text-xs">
                <button onclick="handleDeposit('COINS', 'starter')" class="bg-[#131b2e] border border-gray-800 p-2.5 rounded-xl text-left">
                    <p class="font-bold">Starter Coins</p><p class="text-[10px] text-gray-400">30 Stars ⭐</p>
                </button>
                <button onclick="handleDeposit('ATF', 'tier_1')" class="bg-[#131b2e] border border-gray-800 p-2.5 rounded-xl text-left">
                    <p class="font-bold text-yellow-400">1 ATF Milestone</p><p class="text-[10px] text-gray-400">Dynamic Rate ⭐</p>
                </button>
            </div>
        </div>

    </main>

    <!-- MODAL POPUP -->
    <div id="custom-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-[#131b2e] border border-[#00f076] rounded-xl w-full max-w-xs p-4 relative text-center">
            <p id="modal-message" class="text-xs text-gray-200 mb-4">Message</p>
            <button onclick="closeModal()" class="w-full bg-[#00f076] text-black font-bold py-1.5 rounded text-xs">OK</button>
        </div>
    </div>

    <!-- NAVIGASI BAWAH -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#131b2e] border-t border-gray-800 flex justify-around py-2 z-40">
        <button onclick="switchTab('farm')" id="nav-farm" class="flex flex-col items-center text-[#00f076] font-bold"><span class="text-lg">🌾</span><span class="text-[9px]">FARM</span></button>
        <button onclick="switchTab('market')" id="nav-market" class="flex flex-col items-center text-gray-400"><span class="text-lg">📈</span><span class="text-[9px]">MARKET</span></button>
        <button onclick="switchTab('task')" id="nav-task" class="flex flex-col items-center text-gray-400"><span class="text-lg">📋</span><span class="text-[9px]">TASK</span></button>
        <button onclick="switchTab('friends')" id="nav-friends" class="flex flex-col items-center text-gray-400"><span class="text-lg">👥</span><span class="text-[9px]">FRIENDS</span></button>
        <button onclick="switchTab('wallet')" id="nav-wallet" class="flex flex-col items-center text-gray-400"><span class="text-lg">💎</span><span class="text-[9px]">WALLET</span></button>
    </nav>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let userData = { id: tg.initDataUnsafe?.user?.id || 8560233709, first_name: tg.initDataUnsafe?.user?.first_name || "Farmer" };

        function switchTab(tab) {
            ['farm', 'market', 'task', 'friends', 'wallet'].forEach(t => {
                document.getElementById(`section-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).className = "flex flex-col items-center text-gray-400";
            });
            document.getElementById(`section-${tab}`).classList.remove('hidden');
            document.getElementById(`nav-${tab}`).className = "flex flex-col items-center text-[#00f076] font-bold";
        }

        function showModal(msg) {
            document.getElementById('modal-message').innerText = msg;
            document.getElementById('custom-modal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('custom-modal').classList.add('hidden'); }

        // Render Multi-Plots UI secara dinamis
        function renderPlots() {
            let container = document.getElementById('plots-container');
            let plotsHtml = '';
            for (let i = 1; i <= 4; i++) {
                plotsHtml += `
                    <div class="bg-[#131b2e] border border-gray-800 p-2.5 rounded-xl text-center space-y-1">
                        <p class="text-[10px] font-bold text-gray-400">Plot #${i}</p>
                        <div id="plot-box-${i}" class="text-xs">
                            <button onclick="plantModal(${i})" class="bg-[#00f076] text-black font-bold px-2 py-1 rounded text-[10px]">Plant Seed</button>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = plotsHtml;
        }

        async function initSession() {
            renderPlots();
            let res = await fetch('/api/user/init', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(userData)
            });
            let data = await res.json();
            if(data.success) {
                document.getElementById('user-coins').innerText = data.user.coins;
                document.getElementById('user-atf').innerText = Number(data.user.atf_balance).toFixed(4);
                document.getElementById('w-coins').innerText = data.user.coins;
                document.getElementById('w-atf').innerText = Number(data.user.atf_balance).toFixed(4);
            }
        }

        function plantModal(plotIndex) {
            let crop = prompt("Choose crop type (APPLE, STRAWBERRY, COFFEE):", "APPLE");
            if(crop) plantSeed(plotIndex, crop.toUpperCase());
        }

        async function plantSeed(plotIndex, cropType) {
            let res = await fetch('/api/farm/plant', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userData.id, plot_index: plotIndex, crop_type: cropType })
            });
            let data = await res.json();
            showModal(data.message);
            if(data.success) initSession();
        }

        window.onload = () => { initSession(); };
    </script>
</body>
</html>
