<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ATFarmbot - Web3 Game Node</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg-color: #080c14;
    --card-bg: rgba(16, 24, 40, 0.85);
    --primary-cyan: #00f2fe;
    --accent-green: #00ff87;
    --warning-yellow: #f59e0b;
    --text-white: #ffffff;
    --text-dim: #94a3b8;
    --border-color: rgba(0, 242, 254, 0.25);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  body { background: var(--bg-color); color: var(--text-white); display: flex; justify-content: center; height: 100vh; overflow: hidden; }

  .app-container { width: 100%; max-width: 420px; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; background: radial-gradient(circle at top, #0d1b2a 0%, #080c14 100%); }

  /* Dashboard Header */
  .header-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 12px; backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; }
  .user-info { display: flex; align-items: center; gap: 8px; }
  .avatar { width: 36px; height: 36px; background: linear-gradient(135deg, var(--primary-cyan), var(--accent-green)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000; }
  .username { font-size: 12px; font-weight: 700; }
  .balances { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .pill { background: rgba(0,0,0,0.6); border: 1px solid var(--border-color); padding: 4px 8px; border-radius: 20px; font-size: 10px; font-weight: bold; }
  .pill span { color: var(--accent-green); }

  /* Notice Board Card */
  .notice-card {
    background: rgba(245, 158, 11, 0.1);
    border: 1px solid var(--warning-yellow);
    border-radius: 14px;
    padding: 10px 14px;
    text-align: center;
    backdrop-filter: blur(5px);
  }
  .notice-title {
    font-size: 11px;
    font-weight: 800;
    color: var(--warning-yellow);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .notice-body {
    font-size: 10px;
    color: var(--text-dim);
    line-height: 1.3;
  }

  /* Views Navigation */
  .view-screen { flex: 1; display: none; flex-direction: column; gap: 12px; margin: 12px 0; overflow-y: auto; }
  .view-screen.active { display: flex; }

  /* Grid Farming Plot */
  .farm-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 4px; }
  .plot-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; position: relative; }
  .btn-action { background: linear-gradient(90deg, #00c6ff, #0072ff); border: none; color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 10px; font-weight: bold; cursor: pointer; }

  /* Bottom Nav */
  .navbar { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; display: flex; justify-content: space-around; padding: 8px 4px; backdrop-filter: blur(10px); }
  .nav-item { background: transparent; border: none; color: var(--text-dim); font-size: 9px; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .nav-item.active { color: var(--primary-cyan); }
</style>
</head>
<body>

<div class="app-container">
  <!-- Top Header -->
  <div class="header-card">
    <div class="user-info">
      <div class="avatar" id="txtAvatar">A</div>
      <div>
        <div class="username" id="txtUsername">Loading...</div>
        <div style="font-size: 8px; color: var(--text-dim);" id="txtUid">ID: -----</div>
      </div>
    </div>
    <div class="balances">
      <div class="pill">COINS: <span id="txtCoins">0</span></div>
      <div class="pill">ATF: <span id="txtAtf" style="color: var(--primary-cyan);">0.0000</span></div>
    </div>
  </div>

  <!-- VIEW 1: FARM -->
  <div id="viewFarm" class="view-screen active">
    <!-- Notice Board Banner -->
    <div class="notice-card">
      <div class="notice-title">⚠️ System Announcement</div>
      <div class="notice-body">
        We apologize for any inconvenience. This game is currently under active development.
      </div>
    </div>

    <!-- Plot Grid -->
    <div class="farm-grid" id="gridPlots"></div>
  </div>

  <!-- VIEW 2: MARKET -->
  <div id="viewMarket" class="view-screen">
    <div class="header-card" style="flex-direction:column; gap:8px; text-align:center;">
      <span style="font-size:12px; font-weight:bold; color:var(--primary-cyan);">Token Conversion Market</span>
      <span style="font-size:9px; color:var(--text-dim);">Exchange Apple Coins into ATF Jetton Tokens</span>
      <button class="btn-action" style="width:100%; margin-top:6px;" onclick="convertCoins()">Convert 10,000 Coins -> 1.0 ATF</button>
    </div>
  </div>

  <!-- VIEW 3: TASK -->
  <div id="viewTask" class="view-screen">
    <div class="header-card" style="justify-content:space-between;">
      <span style="font-size:10px;">Join Official Telegram Channel</span>
      <button class="btn-action" onclick="alert('Task Reward Claimed!')">+150 Coins</button>
    </div>
  </div>

  <!-- VIEW 4: FRIENDS -->
  <div id="viewFriends" class="view-screen">
    <div class="header-card" style="flex-direction:column; gap:6px;">
      <span style="font-size:11px; font-weight:bold;">Invite Friends & Earn Yield</span>
      <input type="text" id="refUrl" readonly style="width:100%; background:#000; border:1px solid var(--border-color); color:#fff; font-size:9px; padding:6px; border-radius:6px;">
      <button class="btn-action" style="width:100%;" onclick="copyRef()">Copy Referral Link</button>
    </div>
  </div>

  <!-- VIEW 5: WALLET -->
  <div id="viewWallet" class="view-screen">
    <div class="header-card" style="flex-direction:column; gap:8px;">
      <span style="font-size:11px; font-weight:bold;">TON Web3 Withdrawal</span>
      <input type="text" id="walletAddr" placeholder="Enter TON Wallet Address (EQ...)" style="width:100%; background:#000; border:1px solid var(--border-color); color:#fff; font-size:10px; padding:6px; border-radius:6px;">
      <button class="btn-action" style="width:100%; background:linear-gradient(90deg, #00ff87, #60efff); color:#000;" onclick="withdrawATF()">Request Withdrawal (Min 5 ATF)</button>
    </div>
  </div>

  <!-- Bottom Navbar -->
  <div class="navbar">
    <button class="nav-item active" onclick="switchTab('Farm', this)"><span>🌾</span>FARM</button>
    <button class="nav-item" onclick="switchTab('Market', this)"><span>📈</span>MARKET</button>
    <button class="nav-item" onclick="switchTab('Task', this)"><span>📝</span>TASK</button>
    <button class="nav-item" onclick="switchTab('Friends', this)"><span>👥</span>FRIENDS</button>
    <button class="nav-item" onclick="switchTab('Wallet', this)"><span>💎</span>WALLET</button>
  </div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if(tg) tg.expand();

  const API_URL = "/api";
  let currentUser = null;
  let userPlots = [];

  async function initGame() {
    const tgUser = tg?.initDataUnsafe?.user || { id: 99988877, first_name: "DemoFarmer" };
    document.getElementById('txtUsername').textContent = tgUser.first_name;
    document.getElementById('txtAvatar').textContent = tgUser.first_name[0];
    document.getElementById('txtUid').textContent = "ID: " + tgUser.id;
    document.getElementById('refUrl').value = `https://t.me/ATFarmbot?start=${tgUser.id}`;

    try {
      const res = await fetch(`${API_URL}/user/init`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ telegram_id: tgUser.id, username: tgUser.first_name })
      });
      const data = await res.json();
      if(data.success) {
        currentUser = data.user;
        userPlots = data.plots;
        updateUI();
      }
    } catch(e) { console.error("Initialization Error", e); }
  }

  function updateUI() {
    document.getElementById('txtCoins').textContent = currentUser.coins;
    document.getElementById('txtAtf').textContent = parseFloat(currentUser.atf_balance).toFixed(4);
    renderPlots();
  }

  function renderPlots() {
    const grid = document.getElementById('gridPlots');
    grid.innerHTML = '';
    userPlots.forEach(p => {
      const card = document.createElement('div');
      card.className = 'plot-card';
      if(p.status === 'empty') {
        card.innerHTML = `<span style="font-size:20px;">🪴</span><button class="btn-action" onclick="plant(${p.plot_index})">Plant (-10 Coins)</button>`;
      } else if(p.status === 'growing') {
        card.innerHTML = `<span style="font-size:20px;">⏳</span><span style="font-size:9px; color:var(--primary-cyan);">Growing...</span>`;
      } else if(p.status === 'ready') {
        card.innerHTML = `<span style="font-size:20px;">🍎</span><button class="btn-action" style="background:#00ff87; color:#000;" onclick="harvest(${p.plot_index})">Harvest (+50)</button>`;
      } else {
        card.innerHTML = `<span style="font-size:20px;">🔒</span><span style="font-size:8px;">Locked</span>`;
      }
      grid.appendChild(card);
    });
  }

  async function plant(plotIndex) {
    const res = await fetch(`${API_URL}/farm/plant`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ telegram_id: currentUser.telegram_id, plot_index: plotIndex })
    });
    const data = await res.json();
    if(data.success) initGame();
    else alert(data.error);
  }

  async function harvest(plotIndex) {
    const res = await fetch(`${API_URL}/farm/harvest`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ telegram_id: currentUser.telegram_id, plot_index: plotIndex })
    });
    const data = await res.json();
    if(data.success) initGame();
    else alert(data.error);
  }

  async function convertCoins() {
    const res = await fetch(`${API_URL}/market/convert`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ telegram_id: currentUser.telegram_id, coin_amount: 10000 })
    });
    const data = await res.json();
    if(data.success) { alert("Conversion successful!"); initGame(); }
    else alert(data.error);
  }

  async function withdrawATF() {
    const addr = document.getElementById('walletAddr').value;
    if(!addr) return alert("Please enter a valid TON Wallet address!");
    const res = await fetch(`${API_URL}/wallet/withdraw`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ telegram_id: currentUser.telegram_id, wallet_address: addr, amount_atf: 5.0 })
    });
    const data = await res.json();
    if(data.success) { alert("Withdrawal request queued!"); initGame(); }
    else alert(data.error);
  }

  function switchTab(tabName, btn) {
    document.querySelectorAll('.view-screen').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    document.getElementById(`view${tabName}`).classList.add('active');
    btn.classList.add('active');
  }

  function copyRef() {
    navigator.clipboard.writeText(document.getElementById('refUrl').value);
    alert("Referral link copied to clipboard!");
  }

  initGame();
</script>
</body>
</html>
